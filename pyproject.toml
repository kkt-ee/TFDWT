[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.hatch.build.targets.wheel]
packages = ["TFDWT"]

[project]
name = "TFDWT"
version = "0.1.2"
authors = [
  { name="Kishore Kumar Tarafdar", email="kkt.compute@gmail.com" },
]
description = "Fast Discrete Wavelet Transform TensorFlow Layers"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research"
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]

[project.urls]
Homepage = "https://github.com/kkt-ee/TFDWT"
Issues = "https://github.com/kkt-ee/TFDWT/issues"
